[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-imaging-offline-collector"
version = "2.1.0"
description = "Offline deliverables collector for CAST Imaging C/C++ analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cast-offline-collector = "cast_offline_collector:cli"
cast-client-export = "client_ci_export:main"
cast-makefile-local-export = "makefile_local_export:main"
cast-makefile-local-audit = "makefile_local_audit:main"
cast-makefile-local-recover = "makefile_local_recover:main"
cast-conan2-inventory = "conan2_inventory:main"

[tool.setuptools]
py-modules = ["cast_offline_collector", "client_ci_export", "makefile_local_export", "makefile_local_audit", "makefile_local_recover", "conan2_inventory"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
ignore = ["E501", "S603"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
