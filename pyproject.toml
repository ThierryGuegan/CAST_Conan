[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-imaging-offline-collector"
version = "2.1.0"
description = "Hardened offline evidence collector for CAST Imaging C/C++ analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cast-offline-collector = "cast_offline_collector:cli"
cast-client-export = "client_ci_export:main"
cast-conan2-inventory = "conan2_inventory:main"

[tool.setuptools]
py-modules = ["cast_offline_collector", "client_ci_export", "conan2_inventory"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
ignore = ["E501", "S603"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
